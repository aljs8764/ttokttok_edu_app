name: ttokttok_app
description: 똑똑 교사·학부모 앱 (하나의 코드베이스, flavor 2개)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0' # Flutter 3.29+ (CardThemeData, Color.withValues)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  stomp_dart_client: ^2.1.3
  intl: ^0.20.2 # flutter_localizations 가 고정하는 버전과 맞춤
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
