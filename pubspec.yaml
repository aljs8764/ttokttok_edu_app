name: ttokttok_app
description: 똑똑 교사·학부모·학생 앱 (하나의 코드베이스, flavor 3개)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0' # Flutter 3.38.1+ (flutter_local_notifications 22 요구)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  stomp_dart_client: ^2.1.3
  intl: ^0.20.2 # flutter_localizations 가 고정하는 버전과 맞춤
  uuid: ^4.5.1
  # 학생앱 QR 출석 (스펙 7-7)
  mobile_scanner: ^7.0.1
  geolocator: ^14.0.2
  # 교사앱 알림장 사진 첨부 (카메라·앨범)
  image_picker: ^1.1.2
  # 푸시 (FCM) — Firebase 설정은 flutterfire configure 로 만든다 (README)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
