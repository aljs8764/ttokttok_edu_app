name: ttokttok_app
description: 똑똑 교사·학부모·학생 앱 (하나의 코드베이스, flavor 3개)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0' # Flutter 3.38.1+ (flutter_local_notifications 22 요구)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  stomp_dart_client: ^2.1.3
  intl: ^0.20.2 # flutter_localizations 가 고정하는 버전과 맞춤
  uuid: ^4.5.1
  # 학생앱 QR 출석 (스펙 7-7)
  mobile_scanner: ^7.0.1
  geolocator: ^14.0.2
  # 셔틀 GPS 지도 (ATT-009) — OpenStreetMap 타일, 키 불필요
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # 소셜 로그인 (AUTH-006) — 키·네이티브 설정은 README '소셜 로그인'
  kakao_flutter_sdk_user: ^2.0.1
  flutter_naver_login: ^2.1.1
  # 교사앱 알림장 사진 첨부 (카메라·앨범)
  image_picker: ^1.1.2
  file_picker: ^10.3.3 # PDF 첨부
  # 행사 명단 엑셀 내려받기 → 공유 시트
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  # 푸시 (FCM) — Firebase 설정은 flutterfire configure 로 만든다 (README)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 앱 UI/UX 디자인 서체 (OFL, assets/fonts/OFL.txt)
  fonts:
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
        - asset: assets/fonts/IBMPlexSansKR-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700
